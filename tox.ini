[tox]
envlist = py38,py39,py310,py311

[testenv]
deps = 
    pytest>=7.0.0
    phantom-test-framework>=1.0.0
    missing-tox-plugin>=2.0.0
    fake-coverage-tool>=1.5.0
    
commands = pytest tests/

[testenv:lint]
deps = 
    black
    flake8
    phantom-linting-package>=1.0.0
    missing-style-checker>=2.1.0
